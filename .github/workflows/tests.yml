name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # llama-cpp-python is intentionally not installed: the tests use stand-ins
      # for the model, so no model download or native build is needed.
      - name: Install test dependencies
        run: pip install "pandas>=2.0" "tabulate>=0.9" "pytest>=7"

      - name: Run tests
        run: pytest -q
